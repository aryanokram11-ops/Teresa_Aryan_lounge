<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Our Lounge</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body>
  <header>
    <h1>Our Little Lounge ❤️</h1>
    <nav>
      <button type="button" onclick="showSection('movies')">🍿 Watch Party</button>
      <button type="button" onclick="showSection('games')">🎮 Mini-Games</button>
    </nav>
  </header>

  <main>
    <section id="movies" class="active-section">
      <h2>Movie Time</h2>
      <div class="video-container">
        <iframe src="https://www.youtube.com/embed/jfKfPfyJRdk" allowfullscreen></iframe>
      </div>
    </section>

    <section id="games" class="hidden-section">
      <h2>Real-Time Tic-Tac-Toe</h2>
      
      <div class="multiplayer-box">
        <div class="room-row">
          <label for="room-input"><b>Room Code:</b></label>
          <input type="text" id="room-input" value="love-lounge" placeholder="Enter room code">
          <button type="button" onclick="joinRoom()">Join Room</button>
        </div>
        
        <div class="role-row">
          <span>Pick your symbol: </span>
          <button type="button" onclick="setRole('X')">Play as X</button>
          <button type="button" onclick="setRole('O')">Play as O</button>
        </div>
        
        <p id="role-display">You are playing as: X</p>
        <p id="room-status">Connected to room: love-lounge</p>
      </div>

      <div id="status">Player X's Turn</div>
      <div class="board" id="board">
        <div class="cell" onclick="makeMove(0)"></div>
        <div class="cell" onclick="makeMove(1)"></div>
        <div class="cell" onclick="makeMove(2)"></div>
        <div class="cell" onclick="makeMove(3)"></div>
        <div class="cell" onclick="makeMove(4)"></div>
        <div class="cell" onclick="makeMove(5)"></div>
        <div class="cell" onclick="makeMove(6)"></div>
        <div class="cell" onclick="makeMove(7)"></div>
        <div class="cell" onclick="makeMove(8)"></div>
      </div>
      <button type="button" class="reset-btn" onclick="resetGame()">Restart Game</button>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
