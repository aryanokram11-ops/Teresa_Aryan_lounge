<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Our Lounge</title>
  <link rel="stylesheet" href="style.css">
  <!-- Added PeerJS library -->
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
</head>
<body>
  <header>
    <h1>Our Little Lounge ❤️</h1>
    <nav>
      <button onclick="showSection('movies')">🍿 Watch Party</button>
      <button onclick="showSection('games')">🎮 Mini-Games</button>
    </nav>
  </header>

  <main>
    <section id="movies" class="active-section">
      <h2>Movie Time</h2>
      <div class="video-container">
        <iframe src="https://www.youtube.com/embed/jfKfPfyJRdk" allowfullscreen></iframe>
      </div>
    </section>

    <section id="games" class="hidden-section">
      <h2>Live Two-Player Tic-Tac-Toe</h2>
      
      <!-- Connection Controls -->
      <div class="multiplayer-box">
        <p>Your ID: <b id="my-id">Generating...</b></p>
        <input type="text" id="partner-id" placeholder="Paste partner ID here">
        <button onclick="connectToPartner()">Connect</button>
        <p id="connection-status">Status: Disconnected</p>
      </div>

      <div id="status">Connect to start playing!</div>
      <div class="board" id="board">
        <div class="cell" onclick="makeMove(0)"></div>
        <div class="cell" onclick="makeMove(1)"></div>
        <div class="cell" onclick="makeMove(2)"></div>
        <div class="cell" onclick="makeMove(3)"></div>
        <div class="cell" onclick="makeMove(4)"></div>
        <div class="cell" onclick="makeMove(5)"></div>
        <div class="cell" onclick="makeMove(6)"></div>
        <div class="cell" onclick="makeMove(7)"></div>
        <div class="cell" onclick="makeMove(8)"></div>
      </div>
      <button class="reset-btn" onclick="resetGame()">Restart Game</button>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
